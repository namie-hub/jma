# .github/workflows/atlas-ingest.yml
#
# ONE workflow for all Actions-side ingests of the Japan Atlas:
#   - HKO comparison track  -> hko_tctrack.js   (scripts/ingest_hko_tctrack.py)
#   - Nankai Trough latch   -> jma_nankai.js    (scripts/ingest_nankai.py)
#   - TC forecast archiver  -> archive/tc_*.json (scripts/archive_typhoon_forecasts.py)
#
# REPLACES update-nankai.yml — DELETE that file when adding this one, or the
# two workflows will double-poll JMA and race each other on push (the exact
# failure that hit the HK Atlas on 23 Jul 2026 and forced its consolidation).
# update-phenology.yml and update-typhoon-history.yml stay separate: their
# daily/weekly cadences never overlap this one's minutes, and folding slow
# archives into a 30-minute job would re-run them 47 times a day for nothing.
#
# Why the HKO leg exists at all: scripts/ingest_hko_tctrack.py has been in
# the repo since 23 Jul with NO workflow running it, so the weather page's
# HKO comparison layer sat frozen at its seed. Same for the archiver — no
# bulletins were being banked, which Batch 4 (hindsight scoring) depends on.
#
# Cadence: :12 and :42 every hour, mirroring the HK Atlas. HKO bulletins
# land on the :00/:30 grid (3-hourly near, 6-hourly distant), so worst-case
# pickup lag is ~12 min. The Nankai leg was hourly under update-nankai.yml;
# at :12/:42 it now polls eqvol_l.xml twice hourly — a 46 KB feed built for
# polling, and the browser already hits eqvol.xml every 10 min. Simpler than
# gating the leg by wall-clock minute, which delayed cron makes unreliable.
#
# Commit-only-on-change: volatile generation timestamps ("generatedAt" in
# hko_tctrack.js, "generated" in jma_nankai.js) are stripped before diffing,
# so quiet periods produce zero commits. Archive files carry no top-level
# timestamp: the archiver dedups on bulletin issue time and only touches a
# file when a genuinely new bulletin exists, so plain git-status detects it.
#
# Escalation model (differs from the HK workflow's, deliberately): a leg
# failing is escalated ONLY if this workflow has had no fully-green run in
# the past 3 h, checked against the Actions API with the job's own token.
# The HK rule ("failed leg + committed data older than 3 h") misfires during
# quiet spells, where data is legitimately old — one transient blip would
# email. "No green run in 3 h" is true sustained failure regardless of how
# quiet the feeds are. (Candidate backport to the HK workflow later.)
#
# Escalation redesign (26 Sep 2026, after runs #694 and #706):
# The old rule ("no green run in the last 3 h", via the Actions API) had two
# flaws. (1) Circular: a run with a failed leg that was judged transient
# exits green, so a leg failing forever keeps "refreshing" the last green
# run and never escalates. (2) GitHub's scheduler has been starving this
# cron (every ~35 min in mid-Aug, every 3-6 h by late Sep), so ANY single
# blip now sits >3 h after the previous green run and emails (#706: one
# "early" blip, recovered next run).
# Now: .github/ingest-health.json records, per leg, when its CURRENT failure
# streak began. A leg that succeeds is dropped from the file. Escalation
# fires only when a leg is still failing on a later run and its streak is
# >= 3 h old — true sustained failure at any cadence, with no API call. The
# file only changes when a streak starts or clears, so it adds no commits in
# healthy periods. Failed legs are always surfaced as a public annotation.

# The unit-test step runs BEFORE the ingests and is fail-fast, deliberately:
# if the parser contract is broken, the correct outcome is to write nothing
# and leave the previous data in place, exactly as a fetch failure does. The
# tests are offline fixtures (~0.01 s), so paying for them 48x/day is free,
# and gating here guarantees they actually run — a push-only test workflow
# would never fire on the scheduled path, which is the only path that writes.

name: Japan Atlas data ingest

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Delayed cron runs can queue up; never let two ingests run concurrently.
concurrency:
  group: atlas-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parser contract tests (fail fast — a broken parser writes nothing)
        run: python3 -m unittest discover -s tests

      - name: Run all ingests (each fail-loudly, none blocks the others)
        id: run
        run: |
          fails=""
          python3 scripts/ingest_hko_tctrack.py          || fails="$fails hko"
          python3 scripts/ingest_nankai.py jma_nankai.js || fails="$fails nankai"
          python3 scripts/ingest_early_warning.py jma_early.js || fails="$fails early"
          python3 scripts/archive_typhoon_forecasts.py archive || fails="$fails archiver"
          echo "fails=${fails# }" >> "$GITHUB_OUTPUT"

      - name: Track leg failure streaks (state in .github/ingest-health.json)
        id: health
        env:
          FAILS: ${{ steps.run.outputs.fails }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          path = ".github/ingest-health.json"
          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
          try:
              with open(path) as f:
                  state = json.load(f)
          except Exception:
              state = {}
          fails = os.environ.get("FAILS", "").split()
          # Keep the original start time for a continuing streak; start new ones now.
          new = {leg: state.get(leg, now.isoformat()) for leg in fails}
          sustained = []
          for leg, since in sorted(new.items()):
              age = (now - dt.datetime.fromisoformat(since)).total_seconds()
              print(f"{leg}: failing since {since} ({age/3600:.1f} h)")
              if age >= 3 * 3600:
                  sustained.append(f"{leg}(since {since})")
          if new != state and (new or os.path.exists(path)):
              with open(path, "w") as f:
                  json.dump(new, f, indent=2, sort_keys=True)
                  f.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write("sustained=" + " ".join(sustained) + "\n")
          PY

      - name: Commit whatever changed (ignoring generation timestamps), rebase-retry push
        run: |
          # A failed leg exits without writing (fail-loudly scripts), so its
          # file is simply unchanged here and the healthy legs still commit.
          strip() { grep -v '"generatedAt"' "$1" | grep -v '"generated"' || true; }
          changed=""
          for f in hko_tctrack.js jma_nankai.js jma_early.js; do
            if git show "HEAD:$f" > /tmp/old.js 2>/dev/null \
               && diff <(strip /tmp/old.js) <(strip "$f") > /dev/null; then
              git checkout -- "$f" 2>/dev/null || true   # discard timestamp-only rewrite
              echo "$f unchanged."
            else
              changed="$changed $f"
            fi
          done
          # Failure-streak state: changes only when a streak starts or clears.
          if [ -n "$(git status --porcelain .github/ingest-health.json 2>/dev/null)" ]; then
            changed="$changed health"
            git add .github/ingest-health.json
          fi
          # Archive files: new or updated snapshots only; no volatile fields.
          if [ -n "$(git status --porcelain archive/ 2>/dev/null)" ]; then
            changed="$changed archive"
            git add -A archive/
          fi
          if [ -z "$changed" ]; then
            echo "No data changed — no commit."
            exit 0
          fi
          # The release bundle is deliberately NOT rebuilt here. Ingest runs
          # 48x/day and zip compression defeats git delta reuse, so every rebuild
          # is a fresh ~482 KB blob in permanent history (~23 MB/day during a
          # typhoon). The bundle's data snapshot instead refreshes weekly
          # (update-typhoon-history.yml) and whenever hand-authored source
          # changes (verify-manifest.yml self-heal). RELEASE.sha256 inside
          # the bundle states exactly which snapshot it carries.
          git config user.name  "atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in $changed; do case "$f" in archive|health) ;; *) git add "$f" ;; esac; done
          git commit -m "Atlas ingest:$changed"
          # A push can still lose a race (e.g. against a manual web-UI push).
          # Rebase our data commit onto origin and retry.
          ok=""
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            echo "push rejected (attempt $i) — rebasing onto origin/main"
            git pull --rebase origin main
          done
          [ -n "$ok" ] || { echo "push failed after 3 attempts" >&2; exit 1; }

      - name: Escalate only sustained ingest failures
        env:
          FAILS: ${{ steps.run.outputs.fails }}
          SUSTAINED: ${{ steps.health.outputs.sustained }}
        run: |
          [ -z "$FAILS" ] && { echo "all ingests OK"; exit 0; }
          # Public annotation: names the failed leg without needing to sign in to logs.
          echo "::warning title=Ingest leg failed::$FAILS"
          if [ -z "$SUSTAINED" ]; then
            echo "transient: failure streak under 3 h — no alert, next run re-checks"
            exit 0
          fi
          echo "::error title=Sustained ingest failure::still failing on a later run, streak >= 3 h: $SUSTAINED"
          exit 1
